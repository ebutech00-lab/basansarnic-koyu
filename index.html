<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Bakımda</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #020617);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      background: rgba(59, 130, 246, 0.25);
      border-radius: 50%;
      filter: blur(90px);
      top: -120px;
      left: -120px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      background: rgba(14, 165, 233, 0.18);
      border-radius: 50%;
      filter: blur(90px);
      bottom: -120px;
      right: -120px;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 55px 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 25px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 15px 35px rgba(37, 99, 235, 0.35);
      animation: pulse 2.2s infinite;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 18px;
      line-height: 1.75;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #bfdbfe;
      border: 1px solid rgba(147, 197, 253, 0.35);
      font-size: 15px;
      margin-bottom: 30px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 18px #38bdf8;
      animation: blink 1.4s infinite;
    }

    .progress {
      width: 100%;
      max-width: 430px;
      height: 8px;
      background: rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      margin: 0 auto 32px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 999px;
      animation: loading 2.5s infinite ease-in-out;
    }

    .footer {
      font-size: 14px;
      color: #94a3b8;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes loading {
      0% { transform: translateX(-120%); }
      50% { transform: translateX(90%); }
      100% { transform: translateX(260%); }
    }

    @media (max-width: 600px) {
      .container {
        padding: 42px 22px;
        border-radius: 22px;
      }

      h1 {
        font-size: 30px;
      }

      p {
        font-size: 16px;
      }

      .logo {
        width: 72px;
        height: 72px;
        font-size: 36px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">⚙️</div>

    <h1>Web Sitemiz Bakımda</h1>

    <p>
      Daha iyi, daha hızlı ve daha güvenli bir deneyim sunabilmek için
      sistemimizde kısa süreli bakım çalışması yapılmaktadır.
      En kısa sürede tekrar hizmetinizde olacağız.
    </p>

    <div class="status">
      <span class="dot"></span>
      Bakım çalışması devam ediyor
    </div>

    <div class="progress">
      <span></span>
    </div>

    <div class="footer">
      © 2026 Tüm Hakları Saklıdır
    </div>
  </main>
</body>
</html>
